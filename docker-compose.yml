services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: products
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  reranker:
    build:
      context: .
      dockerfile: services/reranker/Dockerfile
    ports:
      - "5433:8080"
    environment:
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      RERANKER_BATCH_SIZE: 8
      RERANKER_MAX_LENGTH: 512
    volumes:
      - reranker-model-cache:/root/.cache/huggingface

  attribute-classifier:
    build:
      context: .
      dockerfile: services/attribute_classifier/Dockerfile
    ports:
      - "5434:8081"
    environment:
      ATTRIBUTE_CLASSIFIER_MODEL: ${ATTRIBUTE_CLASSIFIER_MODEL:-/app/services/attribute_classifier/training/trained_models/attribute-relevance-setfit}
      ATTRIBUTE_CLASSIFIER_THRESHOLD: ${ATTRIBUTE_CLASSIFIER_THRESHOLD:-0.5}
    volumes:
      - ./services/attribute_classifier/training/trained_models:/app/services/attribute_classifier/training/trained_models:ro
      - attribute-classifier-model-cache:/root/.cache/huggingface

  completion-evaluator:
    build:
      context: .
      dockerfile: services/completion_evaluator/Dockerfile
    ports:
      - "5435:8082"
    environment:
      COMPLETION_EVALUATOR_MODEL: ${COMPLETION_EVALUATOR_MODEL:-MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7}
      COMPLETION_EVALUATOR_MAX_LENGTH: ${COMPLETION_EVALUATOR_MAX_LENGTH:-512}
    volumes:
      - completion-evaluator-model-cache:/root/.cache/huggingface

volumes:
  pgdata:
  reranker-model-cache:
  attribute-classifier-model-cache:
  completion-evaluator-model-cache:
